test: # テスト走行時に使用するパラメータ群
  v_max: 1500
  accl: 42500
  decel: -47500 
  dia_accl: 45000
  dia_decel: -47500
  dist: 120 #直進
  suction_active: 2

  # v_max: 1500
  # accl: 42500
  # decel: -47500
  # # accl: 22500
  # # decel: -22500
  # dia_accl: 45000
  # dia_decel: -47500
  # dist: 120 #直進
  # suction_active: 2

  # sla_accl: 28000
  # sla_decel: -30000

  # v_max: 11550
  # accl: 28000
  # decel: -68000
  # dist: 720 #直進
  # suction_active: 2

  end_v: 10
  dia: 0
  w_max: 12.5
  alpha: 180
  ang: 3600
  search_mode: 0
  
  # [重要] AM32 ESC移行により、suction_duty系は0〜100%のduty%ではなく
  # ESCへの目標パルス幅を「us(1000〜2000)」で直接指定する値になった
  # (1000=停止/アーム, 2000=フル)。旧BldcActuator用の値(9.0等)は無効に
  # なるため、us単位の値に置き換え済み(要実機再調整)。
  # 1999(ほぼ100%)だと個体によって脱調(ESCの転流とローター位置がズレて
  # 空転し高速回転できない)、1600まで下げると完全無反応だったため、
  # 間を取って1800を試す(要実機再調整。実用域を二分探索中)。
  suction_duty: 1800
  suction_duty_low: 1800

  # Alter
  # suction_duty_burst: 4.0
  # suction_duty_burst_low: 3.750
  # Nova
  suction_duty_burst: 1800
  suction_duty_burst_low: 1800 # suction_duty_burst -0.25

  # suction_duty_burst: 4.0
  # suction_duty_burst_low: 3.75

  # 目標パルス幅へのランプ速度(us/sec)。suction_enable()直後、この速度で
  # 最小パルス(1000us)から目標us値へ線形にランプする
  # (ControlLaw::set_next_duty()参照)。AM32自体のソフトスタートと併用。
  suction_esc_ramp_us_per_sec: 650  # 2000→1000。ランプ時間を約0.5秒→約1秒に延長
                                      # (センサーレスBLDCの起動ハンドオフが軽負荷ファンだと
                                      # 不安定になりやすいため、緩やかに立ち上げて安定性を見る)

  # ---- 以下、旧BldcActuator(自前6-step commutation)専用パラメータ ----
  # AM32 ESC移行によりBldcActuator::tick()/enable()は呼ばれなくなったため
  # 現在は未使用(コード・設定とも参照用に残置。planning_task.hppの
  # bldc_メンバのコメント参照)。
  suction_bldc_hz: 8200
  # バッテリー電圧→{gain, max_amp} LUT(区分線形補間、可変長。3配列とも同じ
  # 長さ・昇順で指定すること)。amp = AMP_BASE*(hz/AMP_BASE_HZ)*gain の
  # V/Hz比例式に使うgainと、そのクランプ上限max_amp(0.48は未検証域で脱調
  # した。実機検証済みの0.35が安全)を、バッテリー電圧ごとに個別調整する
  # (点を増やしたい場合はここに追加すればよい)。
  # [重要] max_ampはこの用途(duty振幅の安全上限)では内部で[0.10, 0.48]に
  # クランプされて使われるが、下のsuction_batt_ramp_gain_table_*のgain係数
  # としては同じ列をクランプ前の生値のまま使う(1.0=無減衰を指定できる)。
  # 1.0を指定してもduty振幅側の安全上限は0.48のまま変わらない。
  suction_batt_v_table:      [11.1,   12.0,   12.6   ]
  suction_batt_gain_table:   [0.120,  0.120,  0.1175]
  suction_batt_max_amp_table: [0.265,   0.270,   0.270   ]
  # 起動ランプ速度(elec_hz/sec。ControlLawのdutyランプ速度にも兼用)は、
  # 現在の回転数推定値(elec_hz)→ramp_gainのLUT(区分線形補間、可変長・
  # 昇順)から求めたベース値に、上のsuction_batt_v_table/
  # suction_batt_max_amp_table(クランプ前の生値、上記参照)から区分線形
  # 補間で求めた値をgain係数として掛けた値を最終的なランプ速度とする。
  # 回転数が上がるほど脱調しやすくなるためhzに応じてベース速度を徐々に
  # 減衰させ、さらに満充電/使用後で変わる脱調マージンをbattery_v側の
  # gain係数として反映する。以下のval列は「gain係数(1.0未満なら減衰)を
  # 掛ける前提」で決め打つこと。
  suction_batt_ramp_gain_table_hz:  [0, 1600,  3000, 4000, 5000 , 7000  , 8000  , 9000   ]
  suction_batt_ramp_gain_table_val: [4500, 4500,  4500, 4000, 4000, 4000, 3750, 3000   ]
  # suction_duty: 3.25
  file_idx: 4
  sla_dist: 90
