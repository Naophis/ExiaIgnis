  # sla_type: 7 #Kojima
  # sla_type: 8 #dia45_2
  # sla_type: 9 #dia135_2
  turn_times: 0
  ignore_opp_sen: 1 #斜めターン後の直進テスト 0無効、1斜め制御なし、2斜め制御あり
  sysid_test_mode: 0 #システム同定のテスト:0 直進、1回転
  sysid_duty: 1.5 #duty 
  sysid_time: 1250 #duty 
  start_turn: 0 #開幕ターンテスト
  