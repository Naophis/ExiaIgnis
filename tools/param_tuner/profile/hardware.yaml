gyro_pid:
  mode: 3

  # 2026-08-30: 旋回直後STRAIGHT区間でkim_theta/ang_kfが約34ms周期で
  # 2〜3回リンギングしてから収束するアンダーダンプ挙動を確認
  # (20260830_220054.csv、アンチワインド・チャタリングバグ修正後も残存)。
  # antiwindup=0で試したところ逆に悪化(20260830_220816/220847/220926.csv、
  # 2段目オーバーシュートが最初の残差より大きくなり、3.7〜4°付近に高止まり
  # して収束しなくなった)。アンチワインド自体は振動を抑える側に効いている
  # ため元に戻す。dゲイン側の検討に戻る。
  antiwindup: 1
  windup_gain: 10.0
  windup_dead_bind: 1.50

  p: 0.000325
  i: 0.01465 # dif angle
  b: 0.0000595 #summation
  # 2026-08-30: turn_end_brake/turn_angle_fb再有効化後のベースラインでd=0.0005
  # を試したところ、旋回終端で duty_l/duty_r が±100%近くまで飽和し
  # v_kf_rが-448まで振れる(左右逆回転)重度の悪化を確認(20260830_222932.csv)。
  # 即座に元へ戻す。
  d: 0.000295

  # p: 0.00
  # i: 0.0
  # b: 0.00
  # d: 0.00

  c: 0.0075
  # c: 0.0
  i_theta_tau: 0.08      # [s] 角度I低域化の一次LPF時定数（例: 0.08〜0.15）
  i_theta_slew: 10.0     # [/s] 角度Iバイアスの変化率制限（例: 10〜50）
  i_theta_max: 20.0      # [-]  角度Iバイアスの振幅上限（例: 5〜20）
  # theta_gate: 0.00875      # [rad] |eθ|が小さい終盤で効かせるゲートの閾値（例: 0.05〜0.15）
  theta_gate: 0.004375      # [rad] |eθ|が小さい終盤で効かせるゲートの閾値（例: 0.05〜0.15）
  omega_gate: 25.0      # [rad/s] |ω_ref|が低い時だけ効かせるゲート（例: 15〜40）

  mpc_q_ang: 500.0  # Angle error weight: HIGH for good tracking (terminal cost is 10x this!)
  mpc_q_vel: 125.0   # Velocity error weight: HIGH for damping to prevent oscillation
  mpc_b: 0.000475        # System gain: CRITICAL! Increase gradually (0.5→1→2→5→10)
  mpc_r: 0.01       # Control cost: SMALL to allow aggressive control
  mpc_horizon: 5    # Prediction horizon
  mpc_max_iter: 10  # QP solver iterations
  mpc_max_torque: 0.0025
  mpc_observer_k: 0.25  # Disturbance observer gain (0.01=slow, 0.05=default, 0.1-0.2=aggressive)

# 旋回終端ブレーキ(2026-08-23追加、要実機チューニング)。
# SLA_BACK_STRでff_duty_rollがideal_w=0と共にゼロへ落ちた後、実測角速度(w_lp)
# が慣性で収束しきらず残る問題への対策(20260823_032339.csv/20260823_032239.csv
# で確認)。計画角速度がw_th未満(常時0)かつ残差がerr_thを超える間だけ、
# gyro_pid.p/dの代わりにp/dを使う。
#
# [重要] duty_roll(=p*error等の合計)はduty%ではなくトルクとして扱われ、
# summation_duty()内でtorque*Resist/(Km*gear_a/gear_b)/battery*100
# (≈4650倍、Resist=4.4/km_gear=Km*gear_a/gear_b≈0.00775/battery≈12.2から算出)
# という変換を経てduty%になる。通常のgyro_pid.p=0.000325が極小なのはこの
# 増幅前提の値であり、ここも同じ増幅を受ける。
# p=0.02, d=0.01(通常比60/34倍)で20260823_033928.csvにて即フル飽和→
# 発振(duty ±99.9で往復)を確認したため、7〜4倍程度まで大幅に縮小した。
# 2026-08-23夜: このコミット当時は未検証(enable=0)のまま一度削除されて
# いたが([[project-kanayama-2d-bugfix-2026-08-23]]参照)、SLA_BACK_STR中の
# w_lp負オーバーシュートの原因調査から復元した。turn_angle_fb.w_gain(既存)
# と役割が重複しないか要実機確認のうえenableすること。
turn_end_brake:
  # 2026-08-30: git履歴確認の結果、良好だった2026-08-28(a7f03e9)時点では
  # enable:1だったのが、いつの間にかenable:0になっていたと判明(今日一日
  # 追いかけていたリンギングの真因)。1に戻す。
  enable: 1
  w_th: 0.5     # |ideal_w|がこれ未満で「終端」とみなす(rad/s)。SLA_BACK_STRは常時0なので実質無条件
  err_th: 0.3   # 2026-08-23夜: ON/OFFゲートとしては撤去済み(control_law.cpp参照)、値自体は未使用
  # 2026-08-23夜: p=0.0025は誤差がまだ大きい段階からduty飽和させてしまい、
  # 実質bang-bang制御になってゼロ交差後に同じだけ逆方向へオーバーシュート
  # していた(20260823_213143.csv、min w_lp=-30.94)。飽和を遅らせるためpを
  # 大幅に下げ、d比率(d/p)を通常gyro_pid相当(0.91)に近づけて減衰を強化。
  # 要実機再検証。
  # 2026-08-23夜: p=0.0008/d=0.0015でw_lpの後半バウンドは縮小したが
  # (20260823_213651/214338/214407.csv)、kim_theta(実測角度)を見ると
  # ゼロ交差前にさらに悪化してから戻る・0を大きく行き過ぎてから戻る、
  # という遅い収束が残っていた(214338: 9.0°→11.9°まで悪化→-5.0°まで
  # 逆オーバーシュート、70tick超かかる)。duty_l/rが数tickでフル反転
  # (-75.2→+99.9等)しており、グリップ音(タイヤスリップ)の原因もこれ。
  # pをさらに下げてフル反転そのものを減らす方向で再検証。
  # 2026-08-23夜: p=0.0005まで下げたところさらに悪化(20260823_214857.csv、
  # min w_lp=-37.5、kim_thetaが-12.7°まで逆オーバーシュートし80tick経っても
  # 収束しない)。ブレーキが弱すぎて修正が遅れ、慣性で余計に回ってから
  # 大きな補正が必要になった逆効果と判断。p=0.0008(213651/214338/214407.csv)
  # が現状ブラケット内で最良、ここに戻す。
  p: 0.0008     # 通常gyro_pid.p(0.000325)の約2.5倍
  d: 0.0015     # 通常gyro_pid.d(0.000295)の約5倍
  # 2026-08-23夜: p/dだけでは同一設定でも収束したり発散気味に彷徨ったり
  # run毎に不安定だった(20260823_215751.csv等)。duty_rollの1tickあたりの
  # 変化量に上限を掛けて急反転を防ぐ狙いで導入。
  # slew=0.0015は誤差30前後でのkp_gain(≈0.026)に対して小さすぎ、目標値まで
  # ランプアップするのに約17tick(17ms)かかってしまい、必要な減速トルクが
  # 遅れてkim_thetaが22.6°まで悪化(20260823_220328.csv、過去最悪)。
  # 急反転の抑制と応答速度のバランスを取るため4倍に緩和、要実機再検証。
  slew: 0.006

# 旋回角度不足への追加角度フィードバック(2026-08-23追加、要実機チューニング)。
# ee->ang.i_bias(=img_ang-kim.theta)は正しく実測とのズレを検出しているが
# (20260823_040833.csv解析: 旋回終盤で-2.7deg相当、目標-45degに対し実測
# -42.3degの不足と一致)、既存gyro_pid.c(0.0075、他モーションと共用)だけ
# ではduty%換算最大1.7〜3.5%程度にしかならず埋めきれない。gyro_pid.c自体は
# 変更せず、SLALOM/SLA_BACK_STR限定でi_biasに追加ゲインを掛ける
# (control_law.cpp calc_angle_velocity_ctrl()参照)。gain=0.02はgyro_pid.c
# と合わせて実効ゲインを約3.7倍にする初期仮値、要実機検証。
turn_angle_fb:
  # 2026-08-30: 良好だった2026-08-28時点の値(enable:1)に一度戻して高速SLALOM
  # (v_max1800〜2884)では問題なかったが、低速ターン(v_max〜1032)でw_lpが
  # -6〜29.5まで激しく発振(目標ideal_w≈11.6の2.5倍以上)する重度の不安定を
  # 確認(20260830_231343.csv)。knym_wはideal_wに滑らかに追従しておりKanayama
  # 側は無関係、gyro_pid/turn_angle_fb側の問題と判断。turn_angle_fb自体には
  # 低速向けのゲート(gyro_pidのantiwindupにはv<500分岐があるがこちらには
  # ない)がなく、高速側でしか検証していなかったため一旦無効化する。
  enable: 1
  gain: 0.03
  # ang.i_bias専用の積分(2026-08-23追加、要実機チューニング)。既存w_error_i
  # (アンチワインドヒステリシス付き)を流用したturn_w_pidは実機で発散した
  # (20260823_050137.csv)ため、単純クランプ付きの独立積分として新設。
  # 控えめな初期仮値: gain_i=0.3, i_max=0.01(rad*s、最大duty寄与を
  # gain_i*i_max*4650≈14%程度に制限)。
  # gain_i=0.75は同一configでSLA_BACK_STR自体が発振する試行と全区間クリーン
  # な試行の両方が出た(2026-08-23、20260823_054446.csv vs 054513.csv)。
  # 限界安定(実機ノイズや初期条件差で転ぶかどうかが決まる状態)と判断し、
  # 安全マージンを取るため引き下げる。
  gain_i: 0.35
  i_max: 0.025
  # I蓄積ウェイト閾値(2026-08-23追加、要実機検証): |w_lp|=0でフル蓄積、
  # |w_lp|>=i_w_gateで蓄積0への線形ランプ。当初on/offのハードゲートで
  # 試したが(20260823_060428.csv)ゲート再開時のステップ的な再点火が
  # 2段目の発振を生んだため連続重み付けに変更(control_law.cpp参照)。
  # 20260823_054917.csv(発振run)はSLA_BACK_STR突入後w_lpが2.6〜3.2、
  # 20260823_054824.csv(収束浅いrun)は0.9〜1.0だった実測を踏まえ、両者を
  # 分ける中間値として初期仮値1.5を維持。0で従来通り常時フル蓄積。
  i_w_gate: 1.5
  # D(2026-08-23追加、要実機チューニング): angle_pid本来のd=4.5相当の
  # 減衰役を、実測kim_theta基準・duty_roll直接加算のこの経路に統合する。
  # gain_d=1.0でSLALOM→SLA_BACK_STR境界のi_bias不連続ジャンプをD項が
  # 丸ごと拾ってしまい実機で大振動(20260823_052617.csv)。境界での前回値
  # 同期漏れをcontrol_law.cppで修正した上で、ゲイン自体も切り分けのため
  # 保守的な値まで下げる。
  gain_d: 0.3
  # w目標offsetへのΔw(2026-08-23追加、要実機検証、rad/s per rad)。
  # 20260823_062913.csv/062821.csvでkim_thetaが2.4°付近に数百tick停滞する
  # 現象を確認、原因はgyro_pid.bの積分がgain/gain_iの直接duty注入分を
  # 外乱とみなして正確に打ち消していたこと(control_law.cpp参照)。この
  # w_gainはw目標自体をずらすためgyro_pid.bと戦わない。i_bias=2.4°=0.042rad
  # でΔw≈0.021rad/s(w_gain=0.5)を狙った初期仮値だが、繰り返し発振を踏まえ
  # 保守的に0.3から始める。
  w_gain: 0.3

# SLALOM/SLA_BACK_STR限定の角速度PID(積分b+減衰d)ブースト(2026-08-23追加、
# 要実機チューニング)。gyro_pid.b(0.0000595)を直接上げると収束は改善するが
# 発振しやすい(実機確認)ため、gyro_pid.b/d自体は変更せず、SLALOM/SLA_BACK_STR
# 限定でbとdを両方上乗せする(dはbより比率を大きく、位相遅れによる発振を
# 抑える狙い)。b=0.00006(既存gyro_pid.bとほぼ同量を追加、合計で約2倍)、
# d=0.0009(既存gyro_pid.dの約3倍を追加)は初期仮値、要実機検証。
# 2026-08-23: b=0.00006/d=0.0009で実機発散(20260823_050137.csv、
# duty±99.9%全飽和、kim_thetaが-51degまでオーバーシュートしSLA_BACK_STR中
# w_lpが±18rad/sで暴走)。積分(b)経路はアンチワインドヒステリシス機構と
# 相性が悪く根本的に発振しやすいと判断、無効化のまま維持する。
# 2026-08-23夜: turn_angle_fb.gain_i(独立クランプ付き積分)がこの役割を
# 安全に代替しているため、このturn_w_pid自体は復元後もenable:0のまま
# 使わない想定([[project-kanayama-2d-bugfix-2026-08-23]]参照)。
turn_w_pid:
  enable: 0
  b: 0.00006
  d: 0.0009

