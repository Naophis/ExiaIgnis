# 光センサー制御
# str_ang_pid: 探索モード専用(calc_sensor_pid()のsearch_mode_分岐)。
# .p=P, .i=D(紛らわしいがコード上そういう割り当て)。.b/.dは高速側で
# 使っていたが、str_ang_pid_fastへ分離したため未使用。
str_ang_pid:
  mode: 2
  # p: 0.000235 #search_mode
  # d: 0.0000125
  # b: 0.000275 #!searchm_mode
  # i: 0.0000075

  # test
  p: 0.035
  i: 0.0325

  c: 0

  # p: 0.0
  # d: 0.0
  # b: 0.0
  # i: 0.0
  # c: 0
  # p: 0.2975
  # d: 0.125
  # b: 0.4975
  # i: 0.125
  # c: 0

# str_ang_pid_fast: 高速(非探索)走行時の壁PD専用ゲイン。p/i/dは本来の意味
# (calc_sensor_pid()の非探索分岐)。旧str_ang_pid.b/dの値をp/dに移設。
# I項は2026-08-22にconditional integration方式で新規追加(要実機チューニング、
# 保守的な初期値)。
# 2026-08-23: kanayama_straight(ky/ki/k_theta)を並行実行する「いいとこ取り」
# 構成に変更。速い成分はこちらのP+Dが担当、定常偏差の解消はkanayama_straight
# のkiに一本化するため、二重積分を避けてi=0にした(旧値0.00375はコメントで保持)。
str_ang_pid_fast:
  mode: 2
  p: 0.0375
  # i: 0.00375 # kanayama_straight.kiと二重積分になるため0に変更(2026-08-23)
  i: 0
  d: 0.0325
  c: 0

  antiwindup: 1
  windup_dead_bind: 15  # |error_p|(mm)がこれを超えている間はI項の積算を停止
  windup_i_max: 90      # I項積算値(error_i)の絶対値クランプ

