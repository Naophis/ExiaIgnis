  th: 15

# calc_sensor_pid_dia()専用のKanayamaカスケード(2026-08-24追加)。
# kanayama_straightとは別パラメータ。kiはey(柱距離誤差)が進行状況で
# 非単調に変化し積分と相性が悪いため未実装のまま様子見。kyは積分と違い
# 蓄積して発散する経路がないためsensor_pid_dia.thでクランプ済みのeyに
# 追加(2026-08-24)。ただしsensor_pid_dia.pも同じeyに反応する比例項(経路A)
# のため、kanayama_straight.ky(0.03)よりだいぶ小さい値から様子を見る。
