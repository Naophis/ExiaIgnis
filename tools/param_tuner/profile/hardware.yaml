# 2026-09-05: viscous_friction 0.001475 -> 0.00036。
# tools/param_tuner/ff_check.py で「実際に出た電圧」を(accl, v)で回帰し、FF項
# だけから作った電圧の係数と比較したところ、速度比例分がモデル2.077に対し実測
# 1.51 V/(m/s) (ratio 0.70〜0.77)で恒常的に過大だった。差分は motor_pid2 の I 項
# が毎tick -2V前後(=duty約18%)打ち消して隠していた。back-EMF項(Ke)だけで
# 1.332 V/(m/s)出るので、残り 1.51-1.332=0.178 を viscous に割り当てる。
# Ke と viscous は直進では完全に共線(どちらも v に比例して電圧に入る)ため
# 分け方は挙動に影響せず、実績のある Ke 側は動かさない方針とした。
coulomb_friction: 0.000015 # クーロン摩擦
viscous_friction: 0.00036 # 粘性摩擦


# coulomb_friction: 0.000015 # クーロン摩擦
# viscous_friction: 0.001475 # 粘性摩擦

# coulomb_friction: 0.0 # クーロン摩擦
# viscous_friction: 0.0 # 粘性摩擦

# 吸引ON時用の摩擦FF(2026-08-23追加、要実機チューニング)。吸引ONで荷重が
# 約250g増えて摩擦も増えるが、上のcoulomb_friction/viscous_frictionは吸引
# OFF基準の値のため、吸引ON中は加速フェーズでFFが摩擦分を過小評価しFB
# (vel_pid.i)が過大反応する現象を確認(latest.csv、trajectory_generator.cpp
# copy_tgt()参照)。初期値は上と同じ(未チューニング)、実機で吸引ON状態の
# 加速テストをしながら増やしていく想定。
# 同定は全て吸引ON(duty_suction=2000)のログで行っているため、実際に効いて
# いたのはこちらの _suction 側。上と同じ値に更新する(吸引OFF側は未検証)。
coulomb_friction_suction: 0.000015
viscous_friction_suction: 0.00036

Resist: 4.4
# 2026-09-05: Mass 0.040 -> 0.0302 (2026-08-22に0.030から上げた分を差し戻す形)。
# ff_check.py の回帰で、加速度比例分の必要電圧がモデル0.1410に対し実測
# 0.104〜0.109 V/(m/s^2)、Mass換算で 0.0296/0.0301/0.0309 kg。3セッション
# (0822/0830/0905、バッテリ・タイヤ接地修正前後をまたぐ)で一致した。
# 当初「低加速域では ratio 0.96 で合っている」と判断したが、その根拠にした
# 20260822_02xx は motor_debug_mode の開ループsysidログ(PIDが動いていない)で
# 比較が成立していなかった。PIDが効いている低速ログ(20260830_212424、
# v=400mm/s定速・吸引OFF)で見直すと、必要電圧0.603Vに対し旧モデル0.838V=
# ratio 0.72 で、高速域(0.70〜0.77)と一致する。FFは全速度域で一様に約30%
# 過大だった、というのが正しい理解。
# 2026-09-05 追試: 0.0302 適用後の高速直進2本(045038 / 051234)で ratio a が
# 1.044 / 1.068 (平均1.056、1本あたりSE±0.013)と一貫して加速項が5〜6%不足した
# ため 0.0302 -> 0.0319。ratio v は 1.053 / 0.959 (平均1.006)なので
# viscous_friction は据え置き。
Mass: 0.0319

