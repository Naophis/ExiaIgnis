# 光センサー制御
# str_ang_pid: 探索モード専用(calc_sensor_pid()のsearch_mode_分岐)。
# .p=P, .i=D(紛らわしいがコード上そういう割り当て)。.b/.dは高速側で
# 使っていたが、str_ang_pid_fastへ分離したため未使用。
str_ang_pid:
  mode: 2
  # p: 0.000235 #search_mode
  # d: 0.0000125
  # b: 0.000275 #!searchm_mode
  # i: 0.0000075

  # test
  p: 0.035
  i: 0.0325

  c: 0

  # p: 0.0
  # d: 0.0
  # b: 0.0
  # i: 0.0
  # c: 0
  # p: 0.2975
  # d: 0.125
  # b: 0.4975
  # i: 0.125
  # c: 0

# str_ang_pid_fast: 高速(非探索)走行時の壁PD専用ゲイン。p/i/dは本来の意味
# (calc_sensor_pid()の非探索分岐)。旧str_ang_pid.b/dの値をp/dに移設。
# I項は2026-08-22にconditional integration方式で新規追加(要実機チューニング、
# 保守的な初期値)。
# 2026-08-23: kanayama_straight(ky/ki/k_theta)を並行実行する「いいとこ取り」
# 構成に変更。速い成分はこちらのP+Dが担当、定常偏差の解消はkanayama_straight
# のkiに一本化するため、二重積分を避けてi=0にした(旧値0.00375はコメントで保持)。
# 2026-09-05: kanayama_straight.ki側は安定条件(ki<angle_pid.p/S)に縛られ
# 時定数が1〜2秒と遅く、実用的な短距離(直進90mm=約0.2秒)では定常偏差を
# 解消しきれないことが実測で判明(lat_check.py)。i=0にした本来の理由
# (windup_i_maxがdtスケーリングされておらず即クランプ/チャタリングしていた
# バグ)は2026-08-30に別修正済みなので、無効化していた理由は解消されている。
# 一本化をやめ、速い成分側にも積分を持たせて短距離での定常偏差解消を狙う。
# 要実機再検証: s_pid_i_v(旧i=0では常時0だった)が滑らかに立ち上がるか、
# duty_sen/w_lpに高周波の暴れ(チャタリング)が出ないかを確認すること。
str_ang_pid_fast:
  mode: 2
  p: 0.0375
  i: 0.00375  # 2026-09-05: 0から復元(理由は上記コメント参照)
  d: 0.0325
  c: 0

  antiwindup: 1
  windup_dead_bind: 15  # |error_p|(mm)がこれを超えている間はI項の積算を停止
  # 2026-08-30: error_iはdtスケーリングなしで毎tick生誤差(mm)を積算する設計
  # だったため、windup_i_max=90だと|error_p|=2.5mm程度でも100ms未満でクランプに
  # 張り付き、以降ずっと飽和/チャタリングし続けていた(20260830_162335.csv、
  # s_pid_pは終始2.5mm未満なのにs_pid_iはidx120から常時-10〜-90で暴れる)。
  # kanayama_straight.kiがこの暴れたerror_iに掛かりΔwへ常時注入され、姿勢の
  # 微振動("ぷるぷる")の原因と診断。windup_i_maxを1/3に絞っただけでは根本
  # 解決しない(サチる速さ・振れ幅が変わるだけ)と判明したため、
  # control_law.cpp側でerror_i積算にdt_を掛ける本修正を実施。それに伴い
  # windup_i_maxを90*dt=0.09相当まで縮小(要実機再検証、初期仮値)。
  windup_i_max: 0.09    # I項積算値(error_i)の絶対値クランプ(dtスケーリング後)

