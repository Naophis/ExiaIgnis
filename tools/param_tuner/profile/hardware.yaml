  init_cov: 0.95 # initial_covariance
  p_noise: 0.05 # process_noise
  m_noise: 0.35 # measurement_noise

# led_blight: [0x05, 0x05, 0x08, 0x0d, 0x02, 0x05]
led_blight: [0x0d, 0x0d, 0x0d, 0x0d, 0x0d, 0x0d]

left_keep_dist_th: 8
# 走行開始時に限り *_keep_dist_th(柱幅相当の再捕捉ヒステリシス)を一回だけ外す。
# 停止状態からの走り出しは star_dist≒dist=0 のため最初の8mmが必ず無制御だった
# (20260908_031634.csv: dist=8.28mm/v=181mm/sで初めて壁PDが立つ)。1で有効。
# 壁が一度でも範囲外になれば通常のヒステリシスへ自然復帰(structs.hpp参照)。
keep_dist_th_start_skip: 1
# 壁の切れ目(kireme)判定に使う *_dist_diff の速度正規化の基準速度[mm/s]。0で無効。
# *_dist_diff は1tickあたりの生の差分なので、同じ壁エッジでも低速では小さく出る
# (v=400mm/sなら1tickで0.4mmしか進まない)。sensor.yaml の kireme_*_fast /
# kireme_*_wall_off* は最短走行の速度域で合わせてあるため、低速直進では実質
# 無効になっていた(20260905_144848.csv: 切れ目で実測0.18mm/tick(最大0.42)に対し
# kireme_r_fast=1.25 が一度も発火せず、後退中の右壁が有効なまま左右差が-5.5mmまで
# 育ち、duty_sen が ±5°(sensor_deg_limitter_str)のレールに34tick張り付いて
# w_lp が ±2.6rad/s で発振した)。
# この速度で走っていたら差分がいくつになるかへ換算する = 走行距離あたりの
# 変化率で判定するのと等価。2200 は最短走行の直進速度域で、そこでは従来と同じ挙動。
# 探索走行は速度がほぼ一定でこの問題が起きず kireme_r/l も探索速度で調整済みの
# ため、正規化は非探索(fast/wall_off)側にのみ効かせている(control_law.cpp
# check_sen_error() 参照)。生の *_dist_diff は WallOffController が別しきい値で
# 使っているので変更していない。
kireme_diff_v_ref: 2200
# kireme_diff_v_ref 正規化の下限[mm/tick](生の差分)。0で無効。
# 正規化は「同じ壁エッジなら差分は速度に比例する」前提だが、センサーの量子化
# (1LSB≈0.04mm)/LPノイズや通常の操舵によるみかけの距離変化は速度に比例せず、
# 低速でも±0.1〜0.25mm/tick程度出る(20260906_025821.csv、v=400の安定壁で
# |diff| p95=0.19〜0.25)。v=400では kireme_*_wall_off=0.25 が生の0.045mm/tick
# 相当まで締まり、ノイズだけで check_diff が落ちて唯一の壁の誤差が1tickだけ0に
# なる→duty_sen(-5°)とkanayama Δwが1tick抜けて角速度目標が約+1rad/s跳ぶ、が
# 数tickおきに起きていた(同csv idx432-550 SLA_FRONT_STR: 166tickのゼロ落ち、
# w_lp ±0.5rad/s振動)。|生差分| < min(しきい値, この値) なら壁ありとみなす。
# min()で挟むので v>=2200 の挙動は変わらない。同csvでの再計算では
# WALL_OFF/SLA_FRONT_STR区間のcheck_diff落ちが 189/488tick → 23/488tick
# (残りはほぼ本物の壁端 0.8〜2mm/tick)。control_law.cpp check_sen_error() 参照。
kireme_diff_noise_th: 0.3
right_keep_dist_th: 8

normal_sla_l_wall_off_th_in: 70 #[mm]
normal_sla_r_wall_off_th_in: 70 #[mm]
normal_sla_l_wall_off_th_out: 80 #[mm]
normal_sla_r_wall_off_th_out: 80 #[mm]

normal_sla_l_wall_off_ref_cnt: 136 #413 -274 = 139 #125~144 
normal_sla_r_wall_off_ref_cnt: 135 #404-274 = 130 #125~144

normal_sla_l_wall_off_dist: 6
normal_sla_r_wall_off_dist: 6
# normal_sla_l_wall_off_dist: 0
# normal_sla_r_wall_off_dist: 0
normal_sla_l_wall_off_margin: 4
normal_sla_r_wall_off_margin: 4