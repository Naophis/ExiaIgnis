# 2026-09-05: MotionPlanning::hold()(吸引ランプ中の静止保持)専用の姿勢復元
# ゲイン。通常のgyro_pid.c(0.0075)はduty換算0.57%/度と弱すぎて、吸引ファンの
# 反動トルクで一瞬回転した分(実測0.3〜0.76°、20260905_2208xx.csv)を
# hold中に戻せていなかった。hold()実行中だけこの値でgyro_pid.cを一時的に
# 置き換える。初期値は暫定(0.0075の8倍)、要実機チューニング。
hold_ang_gain: 0.06
# 2026-09-05: hold_ang_gain(P)だけでは定常偏差が残ると判明
# (20260905_222607.csv: 吸引duty完全プラトー後もkim_thetaが-0.2〜-0.25°で
# 頭打ち)。hold中限定の角度積分I項のゲイン。
# 2026-09-06: hold区間ログ29本(20260905_22xx-23xx.csv)の解析結果:
#  - 回転は吸引パルス1600〜1900us帯(ランプ中)で起き、w_lpが50Hz級で±2〜7°/s
#    揺れながらランダムウォークする(符号はrunごとにばらつく)。プラトー
#    (1999us)到達後は吸引スカートの摩擦で固着し、差動duty±6〜8%を出しても
#    動かない。P=0.06でも4.0でも残留0.2〜0.8°は同程度。
#  - 旧I=0.04では0.5°の残差に対しdutyが3.7%/2.5sしか育たず(固着を破る水準
#    に達するのに数十秒)、実質無効だった。
# hold_ang_i_reset_w_th/hold_ang_i_max_dutyと組み合わせ、「固着を破るまで
# ランプ→動いたら捨てる」スティクション破りとして使う。目安: duty換算は
# torque×約4200%(12V時)なので、0.5°(0.0087rad)に対し 1.0×0.0087×4200≒37%/s
# →15%まで0.4秒、0.2°なら1.0秒。効かなければ上げ、行き過ぎて往復するなら
# 下げる(n≥4で確認)。
# 2026-09-06 04:39-04:41 hold区間ログ4本の結果: 回転は毎回1765〜1907usで
# 左(+1.4〜+2.5°/s、50msで約0.5°のスリップ)、プラトーではPの±4〜5%では
# 動かず残留+0.39〜+0.63°。旧reset条件(|w_lp|>0.1)がファン振動で毎tick
# 掛かりI項がゼロのままだったため(下記ang_th方式へ変更)、Iの効果は未検証。
# 2.0なら0.5°残差で約70%/s→20%上限まで0.3秒、0.2°でも0.7秒。
hold_ang_i_gain: 2.0
# 積分開始/前回リセット時点のkim.thetaから角度がこれ[deg]以上動いたら
# (=固着が破れて機体が回ったら)hold中のI積分を0へ戻す。固着中のランプ→
# 脱出→再固着を繰り返して残差を詰める。プラトー中の角度振動はstd0.02°/
# p99 0.06°(20260906_0439xx.csv)なので0.15で誤リセットしない。0で無効
# (常時積分)。旧hold_ang_i_reset_w_th(角速度判定)は振動で常時リセットに
# なり機能しなかったため廃止。
hold_ang_i_reset_ang_th: 0.15
# 上の判定に使うkim_thetaのLPF時定数[ms]。0で生値。2026-09-06 04:58-05:01の
# ログで、角度ジッタの大きいrun(プラトー中|kim-移動平均|p99=0.08°)では生値
# 判定が30tickに6回リセットを掛けてI項が育たなかったため追加。クリープ
# (0.2°/130tick)は50msでも十分追える。
hold_ang_i_reset_lp_ms: 50
# hold中のI項出力の上限[duty%]。固着が破れない場合の暴走防止。0で無効。
hold_ang_i_max_duty: 20
# 2026-09-06 04:51-04:53 hold区間ログ4本(角度基準reset・gain2.0適用後):
#  unhold時の残留 +0.39〜+0.63° → -0.00/+0.06/+0.25/-0.04。I項は片輪10〜12%
#  (差動20〜24%)で機体がゆっくり(0.2°を約130tick)戻り、0.15°動いた所で
#  リセット→再ランプ、を繰り返している(「若干動く」はこの動作)。上限20%
#  には届いていない(最大10.6%)。
#  +0.25°残ったrunはプラトー終盤(idx2160付近)にファンの突発トルクで+0.4°
#  動き、固定2.45秒の待ちが先に切れたもの → 下のhold_settleで待ちを
#  「収束するまで(上限付き)」に変更。
# プラトー後の待ち(structs.hpp hold_settle_t参照)。min_msまでは無条件に待ち、
# その後 LPF(lp_ms)を掛けた|kim_theta|<ang_th[deg] がstable_ms連続したら
# unholdへ進む。max_msで打ち切り。従来はsleep_ms(2450/2500)固定。実際に
# 待った時間はログには出ない(motion_tgt_val_t::hold_settle_ms)。
# 注意: is_suction_ramping()はsuction_enable()直後にfalseを返しており(ランプ
# 自体は約1.94s)、min_msはランプ開始からの時間として働く(=プラトーは
# 約0.5s)。従来の固定待ちと同じ。
# 2026-09-06 04:58-05:01(生値・0.1°・max4500の初版): 2本が4.5s/3.55sまで
# 待った。固着せず±0.2°揺れ続けるrun(050006)と角度ジッタの大きいrunで
# 300ms連続が成立しなかったため。揺れ続ける機体は待っても収まらないので、
# 100msのLPF値・0.15°で判定し、max_msも3500へ。8本のログ再計算では全て
# 2450〜2500msで抜け、遅い突発トルクで残差が0.2°を超えたrun(045232)だけ
# 延長される。
hold_settle:
  min_ms: 2450
  max_ms: 3500
  ang_th: 0.15
  stable_ms: 300
  lp_ms: 100
# 走り出し姿勢リセット(2026-09-06、structs.hpp start_align_t /
# control_law.cpp update_start_align()参照)。hold後に残った物理的な向きズレ
# (20260906_034820.csv: 走り出しで壁PDが約2°右へ戻す間にego_in.ang/kim_thetaが
# -1.9°へ育ち、以後その偽角度を角度ループが戻そうとし壁PDが打ち消す均衡で
# 横約1mmずれて走り、旋回もそのずれた座標系で実行されていた)を、壁追従が
# 収束した瞬間(=壁と平行)にang/kim.theta/global_pos.ang/各積分を0へ再アン
# カーして吸収する。走行あたり一度。w_lpは1800mm/sで±0.5rad/s揺れるので
# 角速度ではなくヘディング変化量(ego_in.ang)で判定する。
# しきい値はログ再計算で決定(ticks/ang_th/err_th):
#  - 20260906_034820.csv(1800mm/s、壁ありSTRAIGHTは走り出しのidx19〜71の
#    53tickしか無い): 15/0.25/0.5 → idx70で発火(ang=-1.9°、収束後の正しい値)。
#  - 20260906_042352.csv(初回実機、当時は0.3/1.0): idx35で発火したが、その時
#    壁誤差は+0.5→-0.7mmへ横切っている途中(=まだ平行ではない、約0.5〜1°)で
#    ang=+0.3°を0へ切ってしまった。err_thを0.5へ締めてこの過渡を除ける
#    (収束済みの窓は|Δerr|<0.4mm、過渡は0.5〜1.6mm)。
#  - 20260906_042440/042502.csv(左へ1.2〜1.5°ずれた発進): 最初の直線(71tick)
#    内では壁追従が収束せず発火しない。pendingは残るので、次に壁のある
#    STRAIGHTで収束した時点で発火する(このコースは2本目の直線に壁が無く
#    未発火のまま)。
#  - 20260906_025821.csv(400mm/s発進): tickだけだとidx100(ang=+0.16°、まだ
#    w_lp=0.25rad/sで向きが動いている途中、15tick=3.6mmしか進んでいない)で
#    発火するため、窓の最小走行距離dist_mm=20を併用して低速では待たせる。
# 発火tickはログのang/kim_theta/s_pid_i(壁I)が同時に0へ跳ぶので確認できる
# (ログは非同期サンプルなので1tickずれて見えることがある)。
start_align:
  enable: 1
  ticks: 15
  # [mm] 判定窓の走行距離。回帰方式(slope_th>0)では窓長そのもの(30〜60mmで毎tick評価)。
  # 巡航のlat雑音σ0.1mmに対し30mmで勾配精度0.1°程度。1800mm/sなら17tick。
  dist_mm: 40
  # [deg] 窓内のジャイロ角変化の上限。回帰方式ではlat_kで回転分を差し引くので
  # 健全性の上限だけ(1.0)。従来方式(slope_th=0)では0.25が実績値。
  ang_th: 1.0
  err_th: 0.5   # [mm]  窓内の壁誤差変化許容(従来方式のみ。回帰方式では勾配で評価)
  # [mm] 窓内の壁誤差そのものの上限。0で無効。回帰方式では操舵中でも勾配で
  # 判定できるので緩め(2.0)。1.0だと窓のやり直しの大半がこれになり初回発火が
  # 80〜200mmまで遅れた(20260908 5本の再計算)。
  err_abs_th: 2.0
  # 壁基準ヘディング回帰(2026-09-08、structs.hpp start_align_t::slope_th参照)。
  # 窓内の(走行距離, 壁横位置−lat_k·Δang)の最小二乗勾配hを実ヘディングとし、
  # |h|<slope_th[deg]かつ残差RMS<resid_th[mm]で発火、angを0でなくhに置く。
  # 従来の変化量判定は分解能0.5mm/20mm≒1.4°で、走り出しの壁PD過渡で
  # −0.68°(033618 idx168)/−1.35°(031634 idx177)を0と宣言していた。
  # 再計算(20260908 5本): 初回発火31〜55mm、|h|≤0.5°、残差0.06〜0.09mm。
  slope_th: 0.5
  resid_th: 0.3
  # [mm/deg] 45°センサーの回転感度(左旋回で左が近づき右が離れる→見かけ左移動)。
  # 走り出しの回転(並進ほぼ0)から実測 +0.96(033618 idx5-90, r=0.97)/+0.78(031634)。
  lat_k: 0.9
  # [deg] 発火時に向きを書き換える最小差。0で常に書き換え(現状)。
  # 0.8で試算すると035048の初回(壁−0.42 vs ジャイロ+0.27)は守れるが、
  # 6本平均では常時書き換えの方が良い(発火後の|誤差| 1.37°→0.29°、5/6本で改善)。
  # 040141(壁制御OFF)で判明した系統的な左進行(+2.1°、ジャイロには見えない)も
  # 0.5〜0.9°級の補正で打ち消す対象なので不感帯は置かない。
  # 2026-09-09: 90にして発火時の向き書き換え(ang/kim/posの回転)を止める。
  # 最短走行(20260909_004717.csv)で発火のたびに h−ang=+0.3〜+1.3° が入り
  # (壁基準の進行方向に機体向きを合わせるためクラブ分を毎回足す)、4回で
  # 世界座標が+3.2°回って地図が徐々にずれた。横位置の合わせ込みと走り出しの
  # スナップ抑止は残る。向きの補正は wall_fit(β, crab込み)へ移す(段階2)。
  apply_th: 0
  # 2026-09-09: 発火時は向きを0へリセット(1)。フィット値hではなく0(ユーザー要件)。
  zero_heading: 1
  # 判定窓の間に壁PDの操舵|duty_sen|がこれ[deg]を超えたら窓をやり直す。
  # 横位置の補正中(ヨー極値、duty_sen飽和)での誤発火防止。0で無効。
  duty_th: 1.0
  # [mm] これを過ぎたら並行判定を待たず、壁が見えている最初のtickで強制発火(0で無効)。
  # 1区画目の第1直線(約94mm)では1.8m/sで判定が壁切れ前に成立しないため。
  # 発火で0にされるのはその瞬間の実傾き(015235/015301の80mm時点で+0.2/−0.5°)。
  force_dist: 80
  # 走行開始からこの距離[mm]までは「壁の新規検出でang=0にスナップ」を止め、
  # hold中に残った向き(unhold時のang)を走り出しへ持ち越す。従来は走行
  # 1tick目のスナップで必ず0に上書きされていた(20260906_0439xx.csv
  # idx2451→2452: ang 0.44→-0.02、kim_thetaは0.64のまま)。start_align発火後は
  # 距離に関係なく従来通りスナップする。0で従来通り。
  snap_skip_dist: 360
  # 一度発火した後、この距離[mm]走ったら再武装して次の収束でもう一度合わせる。
  # 0で走行あたり一度。2026-09-08: 025901.csvで idx259 に発火して pos/kim も
  # 回ったが、その後1.5秒で ang が再び −0.6° 流れ(壁は中央のまま)、旋回入口
  # では揃っていなかった。300mmなら流れ0.5°/sでも次の再アンカーまで0.4°以内。
  repeat_dist: 0   # 2026-09-09: 走り出しの一回だけ(繰り返しは発火ごとにクラブ分を注入して地図が回る)

# 走行中の壁基準平行推定(2026-09-08、structs.hpp wall_fit_t参照)。
# 未知数は「ジャイロ座標系と迷路格子のずれ」β[deg]。走行方向 = ang + β。βは
# 置き方のずれとクラブを含み、旋回をまたいでも不変なので走行全体で精密化する。
# 段階1(現在): 推定のみ。ログ列 wfit_beta(推定)/wfit_sig(1σ)で検算する。
# 段階2: 角度ループの目標(−β)、壁PD入力の回転補正、壁切れ補正に接続。
wall_fit:
  enable: 1
  # 10本のログで再現(真値=壁OFF走行の進行方向、壁ONは0): 推定誤差RMSは
  # 80mmで0.55°、180mmで0.3°、300mmで0.2°。それ以上は通路自体の局所形状で
  # 0.2〜0.4°ばらつく。観測雑音は1tick間で相関する(パネル段差・リミットサイクル)
  # ため、meas_sigmaは物理値0.25mmより大きめにしてσ(wfit_sig)の過信を減らす。
  # y_qを大きくすると横移動をyの揺らぎに吸わせてβの学習が鈍るので小さく。
  meas_sigma: 2.0    # [mm] 横位置観測の雑音(相関込みの実効値。推定値は変わらずσだけ現実寄りに: 90mmで0.26°、300mmで0.1°)
  beta_sigma0: 1.5   # [deg] 走行開始時のβの不確かさ
  beta_q: 0.1        # [deg/√m] βのゆっくりした変動の許容(0.3以上は500mm以降で悪化)
  y_q: 0.01          # [mm/√mm] 向きで説明できない横移動の許容
  v_min: 50          # [mm/s]
  k_ref: 0.9         # [mm/deg] 45mmでの回転感度(実測0.78〜0.96)
  crab: 0.0          # [deg] 進行方向−機体向き。機体傾き = ang + β − crab
# 壁の新規検出でang=0へスナップする従来動作。段階2でwall_fitを制御に使う際に0にする。
ang_snap_enable: 1

# 減速中のヨーレートループ強化(2026-09-09、structs.hpp brake_yaw_gain_t参照)。
# 1.8m/sからの停止(4.5g)で毎回−1.4°右へヨー(5本で±0.03°)、25m/s²でも−1.0°。
# 左右の制動トルク差に対し直進用gyro_pid.pでは差動dutyが0.8%/gしか返せない
# (必要約1.2%/g)。4.4m/s走行では旋回前の5g減速で向きが1〜4°振れる(005345)。
# 指令減速度が accl_th を超える間だけ gyro_pid.p/d を倍率で強める。
# 旋回中(turn_end_brakeあり)とhold中は対象外。停止中のΔangが0.3°以下になる
# p_scaleを探す(3から)。gyro_pid_gain_limitterでp項が頭打ちなら limitterも要確認。
brake_yaw_gain:
  enable: 1
  accl_th: 3000    # [mm/s^2]
  # ×4.5/d1.25は減速中に発振(044836: 角速度±200〜320°/s、duty差±66%、8ms周期)。
  # ×3で停止時ヨー−1.0→−0.6〜−0.85°(25m/s²)。P増しはここが上限なので3に戻し、
  # 残りは下の brake_yaw_ff(前置き)で消す。
  p_scale: 2.5
  d_scale: 1.0

# 減速中の左右制動トルク差の前置き補償(2026-09-09、structs.hpp brake_yaw_ff_t参照)。
# 停止時の右ヨーは減速度に比例して毎回同じ向き(4.5gで−1.4°、2.5gで−1.0°)。
# 減速度[g]に比例した差動dutyを前置きする。diff_per_g は正で右輪の制動を弱め
# 左輪を強める(右ヨーを打ち消す向き)。初期値1.2%/gから、停止中のΔangが
# 0.3°以内になる値へ。効き過ぎると左へ回る(Δangが正になる)。
brake_yaw_ff:
  enable: 0        # motor_torque_asym に置き換え(2026-09-09)。二重補正になるので同時ONにしない
  accl_th: 3000    # [mm/s^2]
  diff_per_g: 1.2  # [%/g]

# 左右モーターのトルクゲイン非対称の補正(2026-09-09、structs.hpp motor_torque_asym_t参照)。
# brake_yaw_ff(減速度比例)は減速の前半で過剰・後半で不足になった(045334: +0.2→−0.4°)。
# 低速ほど逆起電力が減って制動dutyが増えるので、外乱はトルク指令(電流)に比例する。
# 左が電流あたりトルクで約9%低いとすると、減速時の差動5.4%(4.7g)、1.8m/s巡航の
# 差動+0.9%、走り出しの左ヨーが一つのεで揃う。トルク指令に左×(1+ε/2)、右×(1−ε/2)。
# 加減速の両方に効く。合わせ方: 停止中のΔang(右なら増、左なら減)と、走り出し
# 20〜40mmの左ヨー(+1°)が同時に縮むεを探す。0.02刻み。
# 実測(ループが出した差動duty ÷ トルク分duty): 減速7本 0.082〜0.105(残りのヨー分を
# 含めると約0.10〜0.11)、走り出し加速5本 0.074〜0.135。減速と加速で同符号・同量。
motor_torque_asym:
  enable: 1
  eps: 0.10

