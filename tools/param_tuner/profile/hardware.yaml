  x: 5.123 #mm
  y: -3.125 #mm
  z: 0.0 #mm
  x_theta: 0.0 #deg
  y_theta: 0.0 #deg
  # 車体基準(前方)に対しセンサーが左(CCW)に90deg回転して実装されている。
  # このコードベースのyaw符号規約(w>0=左旋回/CCW、本セッションのduty
  # (+10,-10)→w=-31.19=右旋回で確認済み)に合わせ、センサー座標系→車体
  # 座標系への回転として+90degとした。要実機検証(静止時は影響なし。
  # 旋回中に向心成分が想定通りの軸に出るかで符号を確認すること)。
  z_theta: 90.0 #deg

