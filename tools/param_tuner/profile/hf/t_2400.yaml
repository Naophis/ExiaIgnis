# large:
#   v: 1500
#   ang: 90
#   rad: 57
#   pow_n: 4
#   front: { left: 8.801393980582672, right: 8.801393980582672 }
#   back: { left: 36.86635387303123, right: 36.86635387303123 }
# check
# 2024年  2月  8日 木曜日 23:36:58 JST
# 2026-09-05: rad 60.5 -> 70。pow_n=2/rad=48は不採用(20260905_044431.csv)。
# duty側は狙い通り改善した(alpha 5815->4160、FF差動duty 75.8%->51.7%、入口の
# duty飽和が消え w_lpオーバーシュート +27%->+16%)が、rad縮小でw_maxが39.7->
# 50.0rad/sに上がり横加速度が 9.71G -> 12.23G になってグリップ側で破綻した
# (中盤以降w_encが-162rad/sまで逆転しても車体は27-58rad/sで回り続け、
# ang誤差+22.1°)。pow_nを下げるとfootprintがrad比1.254->1.546に膨らむため、
# 同じ場所に収めるにはradを縮めるしかなく、grip律速の速度域では逆効果。
#
# 代わりにpow_n=4のままradを広げる。実績のある t_2200(pow_n=4/rad=63、
# 20260905_043239.csv、SLALOM中duty飽和0/58tick)との比較:
#            FF差動duty   a_lat    F/tire   footprint X   旋回時間
#   2200/r63    58.8%     7.83G     1.78      79.0mm      58.9ms  <- 実績◎
#   2400/r60.5  75.8%     9.71G     2.30      75.9mm      51.9ms  <- 飽和18/51
#   2400/r70    56.6%     8.39G     1.73      87.8mm      60.0ms  <- 今回
# duty・横G・タイヤ荷重すべてが実績値以下に収まる。代償はfootprint +11.9mm
# と旋回時間 +8.1ms。
#
# front/back: X が 75.86 -> 87.78 と +11.92mm 伸びる分を吸収する必要がある。
# backは従来のback+Yを保つよう -11.92mm。frontは元値4.80/7.80から引くと
# 負になってしまうため、実績のあるt_2200の幾何予算(front+X = 90.5/90.0mm)を
# そのまま適用した値を置いている。t_2400は元々 front+X = 80.7mm と
# t_2200より約10mm手前で旋回を始める設定になっており、この差が意図的な
# チューニングだった場合は下のfrontが約10mm過大になる。初回走行は必ず
# 壁との位置関係を目視で確認すること。
