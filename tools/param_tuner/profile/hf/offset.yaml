# 2026-08-30: trj_length=15を試したところ、旋回終盤でodm_xが85.9に張り付いた
# まま動かなくなり(15ms先=既にモーションフェーズが変わった後の状態を参照して
# しまうため)、kim_xとの乖離が17mm以上・knym_wも35.5まで過大補正になる悪化を
# 確認(20260830_224534.csv)。処理負荷(pln_time_diff)は1000のまま問題なかった
# が、先読みが長すぎるとモーション境界を跨いで参照点が不整合になるとわかった
# ため、実測で良好だったtrj_length=5に戻す。
trj_length: 5 # Number of trajectory points to generate

trj_idx_v:   [0,   300, 1000, 2000, 3000]
trj_idx_val: [0,   0,   0,    2,    3]
# 2026-08-23: 対象範囲をSLALOM/SLA_BACK_STR限定からほぼ全モーションに拡張し、
# w_cmdをcalc_pid_val_ang_vel()のee->w.error_p(ヨー主力ゲインkp/kb/kcの
# 入力)にも配線した(trajectory_generator.cpp calc_kanayama()、
# control_law.cpp参照)。実機テストの結果、enable=1でSTRAIGHT走行の壁追従・
# 向き保持が明確に悪化した(20260823_165521.csv enable=0: 平均|sen_error_p|
# =0.35mm・平均|kim_theta|=0.34° / 20260823_165611.csv enable=1: 2.71mm・
# 5.42°、8〜16倍悪化)。kanayama_straightとの干渉か、kx=10/ky=0.0005が
# SLALOM用のまま流用されているのが原因かは未切り分け。enable=0に戻す。
kanayama:
  kx: 10
  # 2026-08-30: 高速SLALOM(v≈2500)でknym_wが最大38まで伸び「きつい」と
  # 感じたが、内訳を見るとknym_wの大部分はideal_w(そのターン半径・速度で
  # 元々必要なベース角速度)で、Kanayama補正分(ky*ey+k_theta*sin(e_theta))
  # は±1〜9程度の小さな上乗せに過ぎないと判明(20260830_230226.csv)。
  # ky=0.0003に下げてもknym_w最大値はほぼ変わらなかった(37.96→36.72)。
  # 「きつい」の正体はKanayamaではなくその速度帯のターン半径プロファイル
  # 側の問題と判断し、ky は元に戻す。
  ky: 0.0005
  k_theta: 0.0005
  # 2026-08-30: kim.x/y座標系リベースバグ([[project-kim-frame-rebase-bugfix-2026-08-29]])
  # とe_theta基準バグ([[project-kanayama-2d-bugfix-2026-08-23]])を修正済み、
  # かつturn_end_brake/turn_angle_fb再有効化・アンチワインドチャタリング修正も
  # 済んだ状態で再テストする。
  enable: 1
  windup: 1
  windup_deg: 2.5

# STRAIGHT壁追従のKanayamaカスケード(2026-08-22追加、要実機チューニング)。
# kxは未使用(kanayama_tを流用しているだけ)。
# 初回実機テスト(ky=0.0005)ではeyが-35mmまで単調に発散し全く収束しなかった
# ため、kyを大幅に引き上げた(2026-08-22)。
# ky=0.03のみだとeyが-15→-9mm付近で頭打ちになり定常偏差が残ったため、
# I項を追加(ki)。str_ang_pid_fastのwindup_i_max(=90)でクランプされる
# ee->sen.error_iを使うので、ki=0.006なら最大でも0.5rad/s程度の寄与。
# 2026-08-23: str_ang_pid_fast(速いP+D直接duty)より収束が遅いと判明したため
# 排他をやめ、str_ang_pid_fast.i=0にした上で両方を並行実行する「いいとこ取り」
# 構成に変更(control_law.cpp calc_sensor_pid()参照)。
# 2026-08-23: kanayama(2D姿勢、trajectory_generator.cpp calc_kanayama())を
# SLALOM/SLA_BACK_STR限定からほぼ全モーションに拡張し、w_cmd経由でヨーの
# 主力ゲイン(kp/kb/kc、ee->w.error_p)にも配線した。ky*ey(壁センサー基準の
# 横方向補正)は2D kanayamaが持たない独立した情報源(実壁との距離)なので
# そのまま残すが、k_theta*sin(e_theta)(向き補正)は2D kanayama側の向き補正
# (dead-reckoning基準)と役割が重複するため無効化して二重補正を避ける。
kanayama_straight:
  kx: 0
  ky: 0.09
  # 2026-08-30: ki=6.0(元0.006相当)は常時クランプに張り付いてジッター
  # ("ぷるぷる")。ki=2.0(元0.002相当)までジッターは消えたが、今度は
  # s_pid_pが常時-7mm近くまで悪化・kim_thetaも-2.9°まで残留する定常誤差が
  # 出た(20260830_164918.csv、s_pid_iは終始クランプ-0.09に張り付いたまま
  # 補正力不足)。中間値で様子見。
  ki: 0.0
  # 2026-09-05: 0(2D kanayamaの向き補正と重複するため無効化していた)から
  # 復元。実測(knym_w)で2D kanayamaが直進中は終始0.0で全く働いておらず、
  # ey収束後にang_kfが戻らず残留する主因と判明。sen_kanayama_dw経由で
  # calc_pid_val_ang_vel()のoffsetに直接加算される(str_ang_pid_fastの
  # img_ang+duty_sen→angle_pidカスケードより低遅延)。e_thetaはkim_theta
  # (独立実測)基準。ky*ey項(ey~1-2mm)と同程度の寄与になるよう
  # k_theta*sin(e_theta)|e_theta~1°で概算し1.0を初期値とした。要実機検証:
  # ang_kf@wall_off進入の残留角、duty_sen/w_lpのガタつき有無を確認。
  # 2026-09-05: 2.5は同程度の初期ey外乱(+0.30 vs +0.28mm)に対しang_kf@進入が
  # +0.008°と+0.526°で65倍もばらつき、軽い振動(低ダンピング)に入りかけている
  # サインが出た(w_lp最大値自体は1.0の時と同程度なので振幅増大ではなく
  # 応答の再現性低下)。1.0に戻す。
  k_theta: 1.0
  enable: 1
  windup: 1
  windup_deg: 2.5
