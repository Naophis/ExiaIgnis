  ang: 90.0
  pow_n: 4
  rad: 58.5
  # 2026-09-05: front.left/rightを平均値へ統一(姿勢誤差がfront側の左右非対称
  # チューニングに紛れ込む問題の切り分けのため、[[project-dia45-turn-tuning]]
  # 参照)。90degターンはleft/rightが幾何的に対称(v/rad/pow_n/angが左右共通)
  # なので、本来front.left==front.rightのはず。ズレは左右非対称バグの
  # 打ち消し跡である可能性が高い。
  # front: { left: 15.1502694878657064, right: 6.4002694878657064 }
  front: { left: 14.775269487865707, right: 9.775269487865707 }
  back: { left: 30.59381550343086, right: 30.59381550343086 }

  # v: 2000
  # ang: 90.0
  # pow_n: 4
  # rad: 58.5
  # front: { left: 7.620884152999963, right: 7.620884152999963 }
  # back: { left: 45.101234786091396, right: 45.101234786091396 }

# 2026-09-05: pow_n 4 -> 2。alpha_peak = C_n*(v/rad)^2/ang なので、angが半分の
# 45degターンは同じv/radでも90degの2倍のalphaを要求する。n=4/rad=52では
# alpha=8857 -> FF差動duty 115.5% と片側duty100%を超えており、原理的に出せない
# 指令だった(20260905_193923/194122.csv: 入口でduty_rが即99.9飽和、w_lpが
# ideal_wに最大-16rad/s遅れ、その反動で148%オーバーシュート、ang誤差+5.3°/45deg)。
#   n=4 rad=52: T=29.7ms alpha=8857 FF=115.5% a_lat=6.35G
#   n=2 rad=52: T=37.6ms alpha=3996 FF= 52.1% a_lat=6.35G  <- 今回
# radを変えないのでa_latは6.35Gのまま。実証済みの通過実績(9.0G、
# 20260905_051657.csv)に対し余裕が大きく、90degターンと違ってpow_nを下げる
# 代償(横G増)が無い。
#
# 旧コメント「pow_n: 4 # 6にしないと角度の収束が遅い」(2026-05-07, 060155e)は
# 撤回する。当時はLmが同定値の1/17(3.5e-7)で、さらにff_roll_gain_*が
# ff_roll_torque経路に未配線(2026-08-31修正)だったため、ヨー軸は事実上
# フィードバックのみで動いていた。その条件では「指令をきつくするほど実際に
# 速く回る」ので pow_n を上げる判断は正しかったが、FFが正しく効く現在は
# 到達不能なalphaを出すと飽和するだけになる。
#
# [frontの下限] wall_off_controller.cpp で ps_front.dist に
# wall_off_hold_dist_str_l(-2.5) / _r(-5.0) が直接加算されるため、
# front + それ が正でないと SLA_FRONT_STR ごとスキップされ壁切れ補正が
# 効かなくなる(motion_planning.cpp の `if (ps_front.dist > 0)`)。
# よって front.left >= 2.5+margin / front.right >= 5.0+margin が必須。
# これが footprint の上限 = rad の上限を決める。
# dia45の予算は 前+front = 37.19(L)/36.94(R)、後+back = 68.00 なので、
# front.R>=7.0 を満たす n=2 の最大radは 44.0(前=29.72)。
#   n=2 rad=44: T=31.8ms alpha=5582 FF=72.8% a_lat=7.51G front=7.475/7.225
# FF 72.8%はまだ予算(58%)超だが、radはこれ以上広げられない。さらに下げるには
# vを落とすしかない(footprintはradとpow_nだけで決まりvに依らないため、vを
# 下げてもfront/backは変えなくてよい):
#   v=1700 -> FF 64.9% / v=1650 -> FF 61.2% / v=1600 -> FF 57.5%
# まずはv=1800のまま115.5%->72.8%の効果を見て、不足ならvを落とす。
dia45:
  v: 1800
  ang: 45
  pow_n: 2
  rad: 44.0
  # front: { left: 9.25716513994989235, right: 9.00716513994989235 }
  # back: { left: 40.07891890533133, right: 40.07891890533133 }
  front: { left: 12.225, right: 3.225 }
  back: { left: 38.298, right: 38.298 }
