# check
# 2024年  2月  8日 木曜日 23:36:58 JST
# 2026-09-05: rad 60 -> 67。20260905_051657.csv(rad=60)は横G 8.99Gを問題なく
# 通しており(ang誤差+9.1°、旋回後±2°以内で収束)、グリップは足りている。
# 破綻していたのはduty側で、alpha=5430 -> FF差動duty 70.8%は予算(約58%)を
# 12pt超過。入口idx79-85でduty_rが7tick 99.9に張り付き、w_lpがknym_wに
# 最大-14.5rad/s遅れ、その反動で+22%オーバーシュート -> 中盤w_encが負の
# ままw_lpだけ回り続けるスリップ、という連鎖になっていた。
#
# rad=67で alpha 5430->4355、FF 70.8%->56.8%(実績のt_2200/rad63の58.8%以下)、
# a_lat 8.99->8.05G。代償は旋回時間 53.7->60.0ms。
#
# front/backは変更不要。実績のあるt_2200(front+X=90.5, back+Y=134.6)と
# 突き合わせると、現行のfront=6.0/6.5・back=52.594はいずれもrad≈67を前提と
# した値になっている(rad=67ならfront+X=90.0、back+Y=136.6)。rad=60では
# front+X=81.2・back+Y=127.8とどちらも約9mm/7mm不足しており、radだけが
# 小さいまま取り残されていたと見られる。
